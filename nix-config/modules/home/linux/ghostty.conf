# -------------------------
# General
# -------------------------

working-directory = home
scrollback-limit = 10000000
confirm-close-surface = false
# Pinned to stable until ghostty-org/ghostty#13324 (background-opacity not
# applied to new windows with hidden titlebar) is fixed; flip back to tip after.

# -------------------------
# Font
# -------------------------

font-family = "BlexMono Nerd Font Mono"
font-size = 10

# -------------------------
# Window
# -------------------------

title = "Terminal"
window-decoration = true
window-inherit-working-directory = false
window-inherit-font-size = false
window-padding-x = 5
window-padding-y = 10

# -------------------------
# macOS
# -------------------------


# -------------------------
# Colors (Dracula-esque)
# -------------------------

background = #11111b
foreground = #f8f8f2
background-opacity = 0.7

# Normal
palette = 0=#1e1e2e
palette = 1=#ff5555
palette = 2=#50fa7b
palette = 3=#f1fa8c
palette = 4=#6272a4
palette = 5=#ff79c6
palette = 6=#8be9fd
palette = 7=#f8f8f2

# Bright
palette = 8=#44475a
palette = 9=#ff6e6e
palette = 10=#69ff94
palette = 11=#ffffa5
palette = 12=#8be9fd
palette = 13=#ff92df
palette = 14=#a4ffff
palette = 15=#ffffff

# -------------------------
# Cursor
# -------------------------

cursor-style = block
cursor-style-blink = false
cursor-color = #7aa2f7
cursor-text = #1a1b26

# -------------------------
# Splits
# -------------------------

unfocused-split-opacity = 1.0
focus-follows-mouse = true
split-divider-color = #00ecff

# -------------------------
# Keybindings
# -------------------------

# Tabs
keybind = super+shift+t=new_tab
keybind = super+t=unbind

# Surfaces
keybind = super+w=close_surface
keybind = super+shift+w=close_window

# Split navigation
keybind = super+alt+left=goto_split:left
keybind = super+alt+right=goto_split:right
keybind = super+alt+up=goto_split:top
keybind = super+alt+down=goto_split:bottom

# Split resizing
keybind = super+ctrl+left=resize_split:left,50
keybind = super+ctrl+right=resize_split:right,50
keybind = super+ctrl+up=resize_split:up,50
keybind = super+ctrl+down=resize_split:down,50

# Misc
keybind = super+shift+z=toggle_split_zoom
keybind = shift+enter=text:\x1b\r
